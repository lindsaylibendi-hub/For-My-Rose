<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <style>
        :root {
            --bg-color: #ffeef2;
            --card-bg: #ffffff;
            --primary-pink: #ff7597;
            --text-color: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 117, 151, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* Cute Cat Illustration Placeholder */
        .cat-illustration {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background-color: #fce4ec;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: var(--primary-pink);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 50px;
        }

        .btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 151, 0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #ff527b;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Hidden Surprise Section */
        .hidden-content {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ffe0e6;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating elements background */
        .heart {
            position: absolute;
            color: var(--primary-pink);
            font-size: 20px;
            pointer-events: none;
            animation: fly Up 4s linear infinite;
            opacity: 0;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cat couple emoji placeholder. You can swap this with an <img> later -->
        <div class="cat-illustration">🐱❤️🐱</div>
        
        <h1>Happy Birthday! 🎉</h1>
        <p class="message" id="typewriter-text">To someone incredibly special...</p>
        
        <button class="btn" id="action-btn" onclick="revealSurprise()">Unlock Your Gift 🎁</button>

        <div class="hidden-content" id="surprise-section">
            <h3>Pack your bags! ✈️</h3>
            <p style="margin: 10px 0; color: #666;">We are going on a special trip to celebrate your big day!</p>
            <div style="font-size: 40px; margin-top: 15px;">🎟️🧳🗺️</div>
        </div>
    </div>

    <script>
        // Optional: Simple Typewriter Effect for the greeting
        const textElement = document.getElementById('typewriter-text');
        const textToType = "To the most amazing person... I have a little surprise waiting for you inside.";
        let index = 0;

        function typeEffect() {
            if (index < textToType.length) {
                if(index === 0) textElement.innerHTML = "";
                textElement.innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeEffect, 50);
            }
        }
        
        // Start typing effect on load
        window.onload = typeEffect;

        // Reveal surprise action
        function revealSurprise() {
            const surprise = document.getElementById('surprise-section');
            const btn = document.getElementById('action-btn');
            
            surprise.style.display = 'block';
            btn.style.display = 'none'; // Hides button after clicking
            
            // Trigger bursts of floating hearts
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 150);
            }
        }

        // Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's'; // 3s to 5s
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            document.body.appendChild(heart);
            
            // Clean up elements after animation finishes
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
